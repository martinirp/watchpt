<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamHub — Entrar</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 400px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .auth-brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .auth-card {
      background: #0f0f0f;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Tabs */
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #1a1a1a;
      border-radius: 8px;
      padding: 3px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .auth-tab {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      font-weight: 700;
      font-family: var(--font);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .auth-tab.active {
      background: #2a2a2a;
      color: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    /* Form */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .auth-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: rgba(255,255,255,0.4);
    }

    .auth-input {
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 11px 14px;
      color: #fff;
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.15s ease;
      width: 100%;
    }

    .auth-input::placeholder { color: rgba(255,255,255,0.2); }
    .auth-input:focus { border-color: rgba(255,255,255,0.3); }

    .auth-submit {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      margin-top: 4px;
      letter-spacing: 0.01em;
    }

    .auth-submit:hover { background: #e8e8e8; }
    .auth-submit:active { transform: scale(0.98); }
    .auth-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Error / Success message */
    .auth-message {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
      align-items: center;
      gap: 8px;
      line-height: 1.4;
    }

    .auth-message.error {
      display: flex;
      background: rgba(255,59,48,0.1);
      border: 1px solid rgba(255,59,48,0.2);
      color: #ff6b63;
    }

    .auth-message.success {
      display: flex;
      background: rgba(48,209,88,0.1);
      border: 1px solid rgba(48,209,88,0.2);
      color: #30d158;
    }

    .auth-footer {
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-brand">
      <div class="auth-brand-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
      <span class="auth-brand-name">StreamHub</span>
    </div>

    <div class="auth-card">
      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Entrar</button>
        <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Criar Conta</button>
      </div>

      <!-- Mensagem de feedback -->
      <div class="auth-message" id="authMessage"></div>

      <!-- Form de Login -->
      <form class="auth-form" id="formLogin" onsubmit="handleLogin(event)">
        <div class="auth-field">
          <label class="auth-label">Username</label>
          <input class="auth-input" id="loginUsername" type="text" placeholder="seu_usuario" autocomplete="username" spellcheck="false">
        </div>
        <div class="auth-field">
          <label class="auth-label">Senha</label>
          <input class="auth-input" id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="auth-submit" type="submit" id="btnLogin">Entrar</button>
      </form>

      <!-- Form de Registro -->
      <form class="auth-form" id="formRegister" style="display:none;" onsubmit="handleRegister(event)">
        <div class="auth-field">
          <label class="auth-label">Username</label>
          <input class="auth-input" id="regUsername" type="text" placeholder="seu_usuario" autocomplete="username" spellcheck="false">
        </div>
        <div class="auth-field">
          <label class="auth-label">Senha</label>
          <input class="auth-input" id="regPassword" type="password" placeholder="mínimo 4 caracteres" autocomplete="new-password">
        </div>
        <div class="auth-field">
          <label class="auth-label">Confirmar Senha</label>
          <input class="auth-input" id="regPasswordConfirm" type="password" placeholder="repetir senha" autocomplete="new-password">
        </div>
        <button class="auth-submit" type="submit" id="btnRegister">Criar Conta</button>
      </form>
    </div>

    <div class="auth-footer">
      Transmissão P2P local com WebRTC · Sem lag · Sem nuvem
    </div>
  </div>

  <script>
    const font = document.createElement('link');
    font.rel = 'stylesheet';
    font.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap';
    document.head.appendChild(font);

    // Redirecionar se já estiver logado
    (async () => {
      const token = localStorage.getItem('sh_token');
      if (token) {
        try {
          const r = await fetch('/api/me', { headers: { Authorization: `Bearer ${token}` } });
          if (r.ok) { window.location.href = '/'; return; }
        } catch (e) {}
        localStorage.removeItem('sh_token');
        localStorage.removeItem('sh_username');
      }
    })();

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('formLogin').style.display    = isLogin ? 'flex' : 'none';
      document.getElementById('formRegister').style.display = isLogin ? 'none' : 'flex';
      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabRegister').classList.toggle('active', !isLogin);
      hideMessage();
    }

    function showMessage(text, type = 'error') {
      const el = document.getElementById('authMessage');
      el.textContent = text;
      el.className = `auth-message ${type}`;
    }

    function hideMessage() {
      const el = document.getElementById('authMessage');
      el.className = 'auth-message';
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideMessage();
      const btn = document.getElementById('btnLogin');
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!username || !password) { showMessage('Preencha todos os campos.'); return; }

      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await r.json();

        if (!r.ok) { showMessage(data.error || 'Erro ao entrar.'); return; }

        localStorage.setItem('sh_token', data.token);
        localStorage.setItem('sh_username', data.username);
        showMessage('Bem-vindo de volta! Redirecionando...', 'success');
        setTimeout(() => window.location.href = '/', 700);
      } catch (err) {
        showMessage('Erro de conexão com o servidor.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideMessage();
      const btn = document.getElementById('btnRegister');
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm  = document.getElementById('regPasswordConfirm').value;

      if (!username || !password) { showMessage('Preencha todos os campos.'); return; }
      if (password !== confirm) { showMessage('As senhas não coincidem.'); return; }

      btn.disabled = true;
      btn.textContent = 'Criando conta...';

      try {
        const r = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await r.json();

        if (!r.ok) { showMessage(data.error || 'Erro ao criar conta.'); return; }

        localStorage.setItem('sh_token', data.token);
        localStorage.setItem('sh_username', data.username);
        showMessage(`Conta criada! Bem-vindo, ${data.username}! 🎉`, 'success');
        setTimeout(() => window.location.href = '/', 800);
      } catch (err) {
        showMessage('Erro de conexão com o servidor.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Criar Conta';
      }
    }

    // Enter para submeter
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const activeForm = document.getElementById('tabLogin').classList.contains('active')
          ? 'formLogin' : 'formRegister';
        document.getElementById(activeForm).requestSubmit();
      }
    });
  </script>
</body>
</html>
